# Trading Replay — Windows Tauri build + optional signed updater release
# Manual trigger only (avoids burning Actions minutes on every main push).
# App ID: com.tradingreplay.afzali  |  PWA remains independent of this job.
#
# Required GitHub Secrets for signed updater artifacts:
#   TAURI_SIGNING_PRIVATE_KEY          — FULL CONTENTS of the private key file
#                                        (minisign text from `tauri signer generate`,
#                                         including "untrusted comment:" lines).
#                                        Do NOT put a file path in the secret.
#                                        Do NOT Base64-encode the file yourself.
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password (empty string if the key has none)
#
# Optional GitHub Actions Variable (Settings → Variables → Actions):
#   VITE_API_BASE — FastAPI backend origin, NO trailing slash
#                   e.g. https://trading-replay.onrender.com
#                   If unset, the workflow uses the known production backend URL.
#
# Workflow writes the secret to a runner-temp file and passes that path to Tauri
# (avoids Base64-decode errors on multiline minisign keys).
# Without those secrets the Windows installer still builds (unsigned updater
# artifacts may be missing). Never commit the private key.

name: Windows Tauri Build

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for this build"
        required: false
        default: "manual Windows package"
      publish_release:
        description: "Publish GitHub Release with installer + latest.json (requires signing secrets)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag (e.g. v3.42.0). Defaults to v{package version}."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          prefix-key: trading-replay-tauri-win

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $pkg.version
          Write-Host "APP_VERSION=$v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      # ---- Updater gate: binary version (tauri.conf/Cargo) must equal package.json ----
      # latest.json uses the package.json version; the installed binary compares against
      # tauri.conf.json. If they differ the updater says "up to date" or loops forever.
      - name: Verify versions aligned (updater gate)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $conf = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $app = (Select-String -Path src/lib/storageVersions.ts -Pattern 'APP_VERSION\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          Write-Host "package=$v tauri.conf=$conf Cargo=$cargo APP_VERSION=$app"
          if ($conf -ne $v -or $cargo -ne $v -or $app -ne $v) {
            throw "Version mismatch: package=$v tauri.conf=$conf Cargo=$cargo APP_VERSION=$app. Align all four before releasing."
          }

      # Tauri CLI accepts TAURI_SIGNING_PRIVATE_KEY as either raw key text or a
      # filesystem path. Passing the multiline minisign key as a GitHub Actions
      # env string is decoded as Base64 and fails (e.g. "_" at offset 5).
      # Write the secret to a runner-temp file and pass the PATH instead.
      - name: Prepare updater signing key file
        id: signing_key
        shell: pwsh
        env:
          # Keep secret only in this step env — never echo/print it.
          SIGNING_KEY_BODY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY_BODY)) {
            Write-Host "TAURI_SIGNING_PRIVATE_KEY secret is empty — build will produce installers without updater signatures."
            echo "key_path=" >> $env:GITHUB_OUTPUT
            echo "has_key=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $keyPath = Join-Path $env:RUNNER_TEMP "tauri_updater_signing.key"
          # Write UTF-8 without BOM; do not log key body
          [System.IO.File]::WriteAllText($keyPath, $env:SIGNING_KEY_BODY)
          if (-not (Test-Path $keyPath)) { throw "Failed to write signing key file" }
          $len = (Get-Item $keyPath).Length
          Write-Host "Signing key file prepared ($len bytes). Path is not logged."
          echo "key_path=$keyPath" >> $env:GITHUB_OUTPUT
          echo "has_key=true" >> $env:GITHUB_OUTPUT

      # Bake production API origin into the Vite frontend (tauri beforeBuildCommand).
      # Desktop has no Vite proxy; empty VITE_API_BASE makes /health hit the app origin.
      - name: Resolve VITE_API_BASE for desktop frontend build
        id: api_base
        shell: pwsh
        env:
          VAR_API_BASE: ${{ vars.VITE_API_BASE }}
        run: |
          $base = ($env:VAR_API_BASE ?? "").Trim().TrimEnd('/')
          if ([string]::IsNullOrWhiteSpace($base)) {
            # Known production Data Engine (confirmed /health → ok). Public URL, not a secret.
            $base = "https://trading-replay.onrender.com"
            Write-Host "VITE_API_BASE variable unset — using production default host."
          } else {
            Write-Host "VITE_API_BASE taken from repository Actions variable."
          }
          if ($base -notmatch '^https?://') { throw "VITE_API_BASE must be an http(s) origin: $base" }
          # Log host only (no query/path secrets expected)
          try {
            $u = [Uri]$base
            Write-Host ("Resolved API host: {0}" -f $u.Host)
          } catch {
            Write-Host "Resolved API base (host parse failed; value not printed)."
          }
          echo "value=$base" >> $env:GITHUB_OUTPUT

      - name: Build Tauri Windows bundle (signed when key file present)
        env:
          # Prefer path form so CLI reads the file instead of Base64-decoding the secret string.
          TAURI_SIGNING_PRIVATE_KEY: ${{ steps.signing_key.outputs.key_path }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Available to `npm run build` via tauri beforeBuildCommand
          VITE_API_BASE: ${{ steps.api_base.outputs.value }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_BASE)) {
            throw "VITE_API_BASE is empty — refusing desktop build (backend would stay offline)."
          }
          Write-Host "Building with VITE_API_BASE host configured (value not echoed)."
          npm run tauri:build

      - name: Remove temporary signing key
        if: always()
        shell: pwsh
        run: |
          $keyPath = "${{ steps.signing_key.outputs.key_path }}"
          if ($keyPath -and (Test-Path $keyPath)) {
            Remove-Item -Force -ErrorAction SilentlyContinue $keyPath
            Write-Host "Temporary signing key file removed."
          } else {
            Write-Host "No temporary signing key file to remove."
          }

      - name: List bundle outputs
        if: always()
        run: |
          $paths = @(
            "src-tauri/target/release/bundle/nsis",
            "src-tauri/target/release/bundle/msi",
            "src-tauri/target/release"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "=== $p ==="
              Get-ChildItem -Path $p -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize
            } else {
              Write-Host "Missing: $p"
            }
          }

      - name: Generate latest.json updater manifest
        id: manifest
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path $nsisDir)) {
            Write-Host "No NSIS bundle dir — skip latest.json"
            echo "has_manifest=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          Write-Host "NSIS directory contents:"
          Get-ChildItem -Path $nsisDir -File -ErrorAction SilentlyContinue | ForEach-Object { Write-Host ("  {0} ({1} bytes)" -f $_.Name, $_.Length) }

          # Prefer Tauri updater zip when present; otherwise use signed NSIS setup.exe
          # (Tauri 2 createUpdaterArtifacts often emits setup.exe + setup.exe.sig).
          $artifact = $null
          $sig = $null

          $zip = Get-ChildItem -Path $nsisDir -Filter "*.nsis.zip" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            $zip = Get-ChildItem -Path $nsisDir -Filter "*.zip" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if ($zip) {
            $candidateSig = Get-ChildItem -Path $nsisDir -Filter ($zip.Name + ".sig") -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $candidateSig) {
              $candidateSig = Get-ChildItem -Path $nsisDir -Filter "*.sig" -File -ErrorAction SilentlyContinue |
                Where-Object { $_.Name -like ($zip.BaseName + "*") -or $_.Name -eq ($zip.Name + ".sig") } |
                Select-Object -First 1
            }
            if ($candidateSig) {
              $artifact = $zip
              $sig = $candidateSig
              Write-Host "Using updater zip artifact: $($artifact.Name)"
            }
          }

          if (-not $artifact) {
            $exe = Get-ChildItem -Path $nsisDir -Filter "*-setup.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $exe) {
              $exe = Get-ChildItem -Path $nsisDir -Filter "*.exe" -File -ErrorAction SilentlyContinue | Select-Object -First 1
            }
            if ($exe) {
              $exeSig = Get-ChildItem -Path $nsisDir -Filter ($exe.Name + ".sig") -File -ErrorAction SilentlyContinue | Select-Object -First 1
              if ($exeSig) {
                $artifact = $exe
                $sig = $exeSig
                Write-Host "Using signed NSIS setup.exe artifact: $($artifact.Name)"
              }
            }
          }

          if (-not $artifact -or -not $sig) {
            Write-Host "Updater artifact/sig not found (signing secrets may be missing or Tauri did not emit .sig)."
            echo "has_manifest=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $sigText = (Get-Content -Path $sig.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($sigText)) {
            Write-Host "Signature file is empty — skip latest.json"
            echo "has_manifest=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $repo = "${{ github.repository }}"
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag -or $tag.Trim() -eq "") { $tag = "v$version" }
          # softprops/action-gh-release uploads names with spaces rewritten to '.'.
          # latest.json MUST use that GitHub-safe name or the updater gets HTTP 404.
          $githubAssetName = $artifact.Name -replace ' ', '.'
          if ($githubAssetName -ne $artifact.Name) {
            Write-Host "GitHub asset name: '$($artifact.Name)' -> '$githubAssetName'"
          }
          $url = "https://github.com/$repo/releases/download/$tag/$githubAssetName"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = $version
            notes = "Trading Replay $version — Windows auto-update package"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigText
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 6
          $outDir = "src-tauri/target/release/bundle"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $out = Join-Path $outDir "latest.json"
          # UTF-8 without BOM (Tauri updater expects clean JSON)
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText((Join-Path (Resolve-Path $outDir) "latest.json"), $manifest, $utf8NoBom)
          # Sanity-check the file we just wrote before softprops uploads it.
          $written = Get-Content -Path (Join-Path (Resolve-Path $outDir) "latest.json") -Raw -Encoding UTF8
          $writtenObj = $written | ConvertFrom-Json
          if (-not $writtenObj.version -or $writtenObj.version -ne $version) {
            throw "Generated latest.json version='$($writtenObj.version)' does not match built version=$version. Raw head: $($written.Substring(0, [Math]::Min(200, $written.Length)))"
          }
          Write-Host "Wrote $out"
          Write-Host "Manifest version=$version platform=windows-x86_64 url=$url"
          Write-Host "Signature length=$($sigText.Length)"
          echo "has_manifest=true" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "artifact_name=$githubAssetName" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trading-replay-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/**
            frontend/src-tauri/target/release/bundle/latest.json
            frontend/src-tauri/target/release/trading-replay.exe
            frontend/src-tauri/target/release/Trading Replay.exe
          if-no-files-found: error
          retention-days: 30

      - name: Require latest.json when publishing a release
        if: ${{ inputs.publish_release == true || inputs.publish_release == 'true' }}
        shell: pwsh
        run: |
          $path = "src-tauri/target/release/bundle/latest.json"
          if (-not (Test-Path $path)) {
            throw "publish_release=true but latest.json was not generated. Check updater signing secrets and NSIS .sig artifacts."
          }
          $raw = Get-Content $path -Raw
          Write-Host "latest.json present for release publish."
          Write-Host $raw
          $j = $raw | ConvertFrom-Json
          if (-not $j.version) { throw "latest.json missing version" }
          $plat = $j.platforms.'windows-x86_64'
          if (-not $plat) { throw "latest.json missing platforms.windows-x86_64" }
          if (-not $plat.url) { throw "latest.json missing windows-x86_64.url" }
          if (-not $plat.signature) { throw "latest.json missing windows-x86_64.signature" }
          if ($plat.url -match ' ') {
            throw "latest.json url contains a space (GitHub 404). Got: $($plat.url)"
          }
          if ($plat.url -notmatch 'github\.com/.+/releases/download/') {
            throw "latest.json url is not a GitHub release download URL: $($plat.url)"
          }
          Write-Host "latest.json validation OK: version=$($j.version) url=$($plat.url)"

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == true || inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag || format('v{0}', steps.ver.outputs.version) }}
          name: Trading Replay ${{ steps.ver.outputs.version }}
          make_latest: true
          body: |
            ## Trading Replay ${{ steps.ver.outputs.version }}

            Windows desktop package (Tauri NSIS).

            ### How to install (important)
            1. Download **only** this file from Assets:
               `Trading.Replay_${{ steps.ver.outputs.version }}_x64-setup.exe`
            2. Do **NOT** download "Source code (zip)" and extract it.
            3. Do **NOT** run the installer with "Run as administrator".
               This build installs for the **current Windows user** into
               `%LOCALAPPDATA%\Trading Replay\`.
               Running as admin can install into the wrong profile so the
               normal desktop shortcut still opens an old copy.
            4. Double-click the `*-setup.exe` as your normal user.
               Finish the installer, then open **Trading Replay** from the
               Start Menu folder **Trading Replay** (not from Downloads).
            5. Confirm the version inside the app matches this release.

            ### Auto-update
            Installed desktop builds check:
            `https://github.com/${{ github.repository }}/releases/latest/download/latest.json`

            Updater replaces application files only. Journal / Sessions /
            SQLite / market cache stay intact.

            ### Backend
            Desktop builds use `VITE_API_BASE` baked at compile time
            (production Data Engine on Render).

            ${{ inputs.reason }}
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*
            frontend/src-tauri/target/release/bundle/latest.json
          fail_on_unmatched_files: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify published updater endpoint
        if: ${{ inputs.publish_release == true || inputs.publish_release == 'true' }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub CDN can lag after softprops upload. Parse robustly and retry.
          $v = "${{ steps.ver.outputs.version }}".Trim()
          $tagOut = "${{ steps.manifest.outputs.tag }}".Trim()
          if ([string]::IsNullOrWhiteSpace($tagOut)) { $tagOut = "v$v" }
          $repo = "${{ github.repository }}"
          $latestUrl = "https://github.com/$repo/releases/latest/download/latest.json"
          $tagUrl = "https://github.com/$repo/releases/download/$tagOut/latest.json"
          $headers = @{ "Cache-Control" = "no-cache"; "Pragma" = "no-cache"; "Accept" = "application/json,text/plain,*/*" }

          function Get-Utf8Text([object]$content) {
            if ($null -eq $content) { return "" }
            if ($content -is [byte[]]) { return [System.Text.Encoding]::UTF8.GetString($content) }
            return [string]$content
          }

          function Parse-LatestJson([string]$text, [string]$source) {
            if ([string]::IsNullOrWhiteSpace($text)) {
              throw "Empty body from $source"
            }
            $trim = $text.TrimStart([char]0xFEFF).Trim()
            if ($trim.StartsWith("<") -or $trim -match '(?i)<html') {
              throw "Non-JSON HTML from $source (likely 404/soft-404). Head: $($trim.Substring(0, [Math]::Min(180, $trim.Length)))"
            }
            try {
              $obj = $trim | ConvertFrom-Json
            } catch {
              throw "ConvertFrom-Json failed for $source : $_. Head: $($trim.Substring(0, [Math]::Min(200, $trim.Length)))"
            }
            $ver = $null
            if ($obj -and $obj.PSObject.Properties.Name -contains "version") { $ver = [string]$obj.version }
            if ([string]::IsNullOrWhiteSpace($ver) -and $trim -match '"version"\s*:\s*"([^"]+)"') {
              $ver = $Matches[1]
              Write-Host "WARN: used regex fallback for version from $source"
            }
            if ([string]::IsNullOrWhiteSpace($ver)) {
              throw "No version field in $source. Head: $($trim.Substring(0, [Math]::Min(200, $trim.Length)))"
            }
            return @{ obj = $obj; version = $ver; raw = $trim }
          }

          $m = $null
          $okLatest = $false
          for ($i = 0; $i -lt 18; $i++) {
            try {
              $r = Invoke-WebRequest -Uri $latestUrl -Headers $headers -UseBasicParsing -MaximumRedirection 5
              $parsed = Parse-LatestJson (Get-Utf8Text $r.Content) "releases/latest"
              Write-Host "latest endpoint version=$($parsed.version) (want $v) attempt=$($i+1)"
              if ($parsed.version -eq $v) { $m = $parsed.obj; $okLatest = $true; break }
            } catch { Write-Host "latest endpoint check failed: $_" }
            Start-Sleep -Seconds 15
          }

          if (-not $okLatest) {
            Write-Host "WARN: /releases/latest still not serving $v — checking tag asset with retries + API"
            $parsedTag = $null
            for ($j = 0; $j -lt 12; $j++) {
              try {
                $rTag = Invoke-WebRequest -Uri $tagUrl -Headers $headers -UseBasicParsing -MaximumRedirection 5
                $parsedTag = Parse-LatestJson (Get-Utf8Text $rTag.Content) "tag $tagOut"
                Write-Host "tag asset version=$($parsedTag.version) (want $v) attempt=$($j+1)"
                if ($parsedTag.version -eq $v) { break }
              } catch { Write-Host "tag asset check failed: $_" }
              Start-Sleep -Seconds 10
            }
            if (-not $parsedTag -or $parsedTag.version -ne $v) {
              # Last resort: GitHub API release asset metadata (avoids CDN HTML soft-404)
              $apiRel = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tagOut" -Headers @{
                Authorization = "Bearer $env:GH_TOKEN"
                Accept = "application/vnd.github+json"
              }
              $asset = @($apiRel.assets | Where-Object { $_.name -eq "latest.json" }) | Select-Object -First 1
              if (-not $asset) { throw "No latest.json asset on release $tagOut via API" }
              $apiBody = Invoke-RestMethod -Uri $asset.url -Headers @{
                Authorization = "Bearer $env:GH_TOKEN"
                Accept = "application/octet-stream"
              }
              # Invoke-RestMethod may already deserialize JSON
              if ($apiBody -is [string]) {
                $parsedTag = Parse-LatestJson $apiBody "API asset $tagOut"
              } else {
                $verApi = [string]$apiBody.version
                if ([string]::IsNullOrWhiteSpace($verApi)) { throw "API asset latest.json has empty version for $tagOut" }
                $parsedTag = @{ obj = $apiBody; version = $verApi }
              }
              Write-Host "API asset version=$($parsedTag.version)"
            }
            if ($parsedTag.version -ne $v) {
              throw "Tag latest.json version=$($parsedTag.version) does not match built version $v (tag=$tagOut url=$tagUrl)"
            }
            $m = $parsedTag.obj
            $api = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/latest" -Headers @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = "application/vnd.github+json"
            }
            Write-Host "API latest tag=$($api.tag_name) draft=$($api.draft) prerelease=$($api.prerelease)"
            if ($api.draft) { throw "Release is still draft" }
            if ($api.tag_name -ne $tagOut -and $api.tag_name -ne "v$v") {
              throw "API /releases/latest is $($api.tag_name), expected $tagOut. make_latest may have failed."
            }
            Write-Host "Tag + API verification OK (CDN latest pointer may lag briefly)"
          }

          $plat = $m.platforms.'windows-x86_64'
          if (-not $plat -or -not $plat.url) { throw "latest.json missing platforms.windows-x86_64.url" }
          $url = [string]$plat.url
          $h = Invoke-WebRequest -Uri $url -Method Head -MaximumRedirection 5 -UseBasicParsing
          if ($h.StatusCode -ne 200) { throw "Installer URL not downloadable: $url ($($h.StatusCode))" }
          Write-Host "Updater endpoint OK: $v -> $url"
