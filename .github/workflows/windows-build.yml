# Trading Replay — Windows Tauri build + optional signed updater release
# Manual trigger only (avoids burning Actions minutes on every main push).
# App ID: com.tradingreplay.afzali  |  PWA remains independent of this job.
#
# Required GitHub Secrets for signed updater artifacts:
#   TAURI_SIGNING_PRIVATE_KEY          — contents of the private key file
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD — password (empty string if key has none)
#
# Without those secrets the Windows installer still builds (unsigned updater
# artifacts may be missing). Never commit the private key.

name: Windows Tauri Build

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for this build"
        required: false
        default: "manual Windows package"
      publish_release:
        description: "Publish GitHub Release with installer + latest.json (requires signing secrets)"
        type: boolean
        required: false
        default: false
      release_tag:
        description: "Release tag (e.g. v3.42.0). Defaults to v{package version}."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          prefix-key: trading-replay-tauri-win

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Read app version
        id: ver
        shell: pwsh
        run: |
          $pkg = Get-Content package.json -Raw | ConvertFrom-Json
          $v = $pkg.version
          Write-Host "APP_VERSION=$v"
          echo "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build Tauri Windows bundle (signed when secrets present)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npm run tauri:build

      - name: List bundle outputs
        if: always()
        run: |
          $paths = @(
            "src-tauri/target/release/bundle/nsis",
            "src-tauri/target/release/bundle/msi",
            "src-tauri/target/release"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "=== $p ==="
              Get-ChildItem -Path $p -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object FullName, Length, LastWriteTime |
                Format-Table -AutoSize
            } else {
              Write-Host "Missing: $p"
            }
          }

      - name: Generate latest.json updater manifest
        id: manifest
        shell: pwsh
        run: |
          $version = "${{ steps.ver.outputs.version }}"
          $nsisDir = "src-tauri/target/release/bundle/nsis"
          if (-not (Test-Path $nsisDir)) {
            Write-Host "No NSIS bundle dir — skip latest.json"
            echo "has_manifest=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $zip = Get-ChildItem -Path $nsisDir -Filter "*.nsis.zip" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          $sig = Get-ChildItem -Path $nsisDir -Filter "*.sig" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $zip) {
            $zip = Get-ChildItem -Path $nsisDir -Filter "*.zip" -File -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          if (-not $zip -or -not $sig) {
            Write-Host "Updater zip/sig not found (signing secrets may be missing)."
            echo "has_manifest=false" >> $env:GITHUB_OUTPUT
            exit 0
          }
          $sigText = (Get-Content -Path $sig.FullName -Raw).Trim()
          $repo = "${{ github.repository }}"
          $tag = "${{ inputs.release_tag }}"
          if (-not $tag -or $tag.Trim() -eq "") { $tag = "v$version" }
          $url = "https://github.com/$repo/releases/download/$tag/$($zip.Name)"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
          $manifest = @{
            version = $version
            notes = "Trading Replay $version — Windows auto-update package"
            pub_date = $pubDate
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigText
                url = $url
              }
            }
          } | ConvertTo-Json -Depth 6
          $out = "src-tauri/target/release/bundle/latest.json"
          Set-Content -Path $out -Value $manifest -Encoding utf8
          Write-Host "Wrote $out"
          Write-Host $manifest
          echo "has_manifest=true" >> $env:GITHUB_OUTPUT
          echo "tag=$tag" >> $env:GITHUB_OUTPUT
          echo "zip_name=$($zip.Name)" >> $env:GITHUB_OUTPUT

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trading-replay-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/**
            frontend/src-tauri/target/release/bundle/msi/**
            frontend/src-tauri/target/release/bundle/latest.json
            frontend/src-tauri/target/release/trading-replay.exe
            frontend/src-tauri/target/release/Trading Replay.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: ${{ inputs.publish_release == true || inputs.publish_release == 'true' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.manifest.outputs.tag || format('v{0}', steps.ver.outputs.version) }}
          name: Trading Replay ${{ steps.ver.outputs.version }}
          body: |
            ## Trading Replay ${{ steps.ver.outputs.version }}

            Windows desktop package (Tauri).

            ### Install
            Download the NSIS installer (`.exe`) and run it.

            ### Auto-update
            Installed desktop builds check:
            `https://github.com/${{ github.repository }}/releases/latest/download/latest.json`

            Data (Journal, Sessions, SQLite, market cache) is **not** deleted by updates.

            ${{ inputs.reason }}
          files: |
            frontend/src-tauri/target/release/bundle/nsis/*
            frontend/src-tauri/target/release/bundle/msi/*
            frontend/src-tauri/target/release/bundle/latest.json
          fail_on_unmatched_files: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
