# Trading Replay — Windows Tauri build (unsigned)
# Manual trigger only to avoid burning Actions minutes on every main push.
# App ID: com.tradingreplay.afzali  |  PWA remains independent of this job.

name: Windows Tauri Build

on:
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note for this build"
        required: false
        default: "manual Windows package"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    defaults:
      run:
        working-directory: frontend
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          # No package-lock in repo; skip npm cache key from lockfile

      - name: Setup Rust (stable MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri -> target
          prefix-key: trading-replay-tauri-win

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Build Tauri Windows bundle
        # beforeBuildCommand in tauri.conf.json runs `npm run build` (tsc + vite)
        # then packages NSIS/MSI under src-tauri/target/release/bundle/
        run: npm run tauri:build

      - name: List bundle outputs
        if: always()
        run: |
          $paths = @(
            "src-tauri/target/release/bundle/nsis",
            "src-tauri/target/release/bundle/msi",
            "src-tauri/target/release"
          )
          foreach ($p in $paths) {
            if (Test-Path $p) {
              Write-Host "=== $p ==="
              Get-ChildItem -Path $p -File -ErrorAction SilentlyContinue |
                Select-Object Name, Length, LastWriteTime |
                Format-Table -AutoSize
            } else {
              Write-Host "Missing: $p"
            }
          }

      - name: Upload Windows installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trading-replay-windows
          path: |
            frontend/src-tauri/target/release/bundle/nsis/*.exe
            frontend/src-tauri/target/release/bundle/msi/*.msi
            frontend/src-tauri/target/release/trading-replay.exe
            frontend/src-tauri/target/release/Trading Replay.exe
          if-no-files-found: error
          retention-days: 30
