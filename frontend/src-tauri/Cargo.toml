[package]
name = "trading-replay"
version = "3.39.0"
description = "Trading Replay desktop shell (Tauri + SQLite)"
authors = ["Trading Replay"]
edition = "2021"
# Host may be older than 1.77; Tauri 2 prefers >=1.77. rusqlite path is independently testable.
rust-version = "1.70"
# Required when multiple [[bin]] targets exist; Tauri picks this as the app binary.
default-run = "trading-replay"

[lib]
name = "trading_replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trading-replay"
path = "src/main.rs"

[[bin]]
name = "sqlite_verify"
path = "src/bin/sqlite_verify.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.29", features = ["bundled"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
