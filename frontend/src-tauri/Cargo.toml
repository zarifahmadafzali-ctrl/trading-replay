[package]
name = "trading-replay"
version = "3.43.7"
description = "Trading Replay desktop shell (Tauri + SQLite)"
authors = ["Trading Replay"]
edition = "2021"
# Host may be older than 1.77; Tauri 2 prefers >=1.77. rusqlite path is independently testable.
rust-version = "1.70"
# Required when multiple [[bin]] targets exist; Tauri picks this as the app binary.
default-run = "trading-replay"

[lib]
name = "trading_replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "trading-replay"
path = "src/main.rs"

[[bin]]
name = "sqlite_verify"
path = "src/bin/sqlite_verify.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# zip 2.x/4.x are fully yanked on crates.io (2026-10); only zip 9.x remains.
# Windows updater downloads signed NSIS setup.exe and does not require the zip feature.
tauri-plugin-updater = { version = "2.14", default-features = false, features = ["rustls-tls", "system-proxy"] }
tauri-plugin-process = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.29", features = ["bundled"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
