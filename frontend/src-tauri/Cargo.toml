[package]
name = "trading-replay"
version = "3.33.0"
description = "Trading Replay desktop shell (Tauri)"
authors = ["Trading Replay"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "trading_replay_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
