[package]
name = "trading-replay"
version = "3.32.0"
description = "Trading Replay desktop shell (foundation only)"
authors = ["Trading Replay"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
